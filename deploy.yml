name: Deploy to Fly

# Fires when main is merged into production (i.e. a push lands on production).
on:
  push:
    branches: [production]

# Protect the single stateful machine: never let two deploys overlap.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  # Gate the deploy on a real build + the unit tests. Note: this is effectively
  # the FIRST full compile of the Discord layer (commands/scheduler/main) on a
  # toolchain new enough for edition 2024 — watch this job on the first run.
  # Remove this job (and `needs: test` below) if you want deploy-only.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
